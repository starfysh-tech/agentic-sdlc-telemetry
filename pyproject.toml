[build-system]
requires = ["setuptools>=42", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-telemetry"
dynamic = ["version"]
description = "SDLC session analytics extraction for Claude Code"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "textual>=1.0,<9",
    "pyfiglet>=1.0",
]

[project.scripts]
sdlc-t = "manage:main"

[project.urls]
Repository = "https://github.com/starfysh-tech/agentic-sdlc-telemetry"

[tool.setuptools]
py-modules = ["manage", "sdlc_extract"]

[tool.setuptools_scm]

