[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-telemetry"
version = "0.1.0"
description = "SDLC session analytics extraction for Claude Code"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
sdlc-telemetry = "manage:main"

[project.urls]
Repository = "https://github.com/starfysh-tech/agentic-sdlc-telemetry"

[tool.setuptools]
py-modules = ["manage", "sdlc_extract"]
